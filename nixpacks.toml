[phases.setup]
nixPkgs = [
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "libdrm",
  "mesa",
  "libxkbcommon",
  "pango",
  "cairo",
  "alsa-lib",
  "fontconfig",
  "freetype",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "python -m playwright install chromium --with-deps || true",
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"